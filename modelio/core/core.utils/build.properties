# res is needed in source to make automatic tests to succeed
source.. = src/,\
           res/
output.. = bin/

javacSource = 17
javacTarget = 17
bin.includes = META-INF/,\
               .,\
               res/,\
               lib/,\
               lib/deps/accessors-smart-2.5.2.jar,\
               lib/deps/asm-9.7.1.jar,\
               lib/deps/content-type-2.3.jar,\
               lib/deps/jcip-annotations-1.0-1.jar,\
               lib/deps/json-smart-2.5.2.jar,\
               lib/deps/lang-tag-1.7.jar,\
               lib/deps/nimbus-jose-jwt-10.0.1.jar,\
               lib/deps/oauth2-oidc-sdk-11.22.1.jar
bin.excludes = lib/deps/site/,\
               lib/deps/sources/,\
               lib/build_deps/
